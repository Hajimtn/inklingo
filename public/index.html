  <meta name="theme-color" content="#fbf7f1">
  <script>
    // Apply theme / text size / language before the first paint (see js/ui/prefs.js).
    try {
      var sp = JSON.parse(localStorage.getItem('sw:prefs') || '{}');
      var dark = sp.theme === 'dark' || ((!sp.theme || sp.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.font = sp.font || 'm';
      document.documentElement.dataset.motion = sp.motion || 'full';
      document.documentElement.lang = sp.lang === 'en' ? 'en' : 'vi';
    } catch (e) {}
  </script>
